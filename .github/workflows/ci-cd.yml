name: Master End-to-End CI/CD Pipeline

on:
  push:
    branches: [ main, master, Branch-V2 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: 1. Static Analysis & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Pre-Flight Auth Schema Check
        run: node scripts/check-auth-schema.mjs
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: CRUD + Persistence Contract Check
        run: node scripts/audit-crud-persistence.mjs --fail-on-high

  unit-tests:
    name: 2. Jest Unit & Integration Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Jest Tests
        run: npm test -- --coverage --ci --maxWorkers=2 --forceExit
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
          EXPO_PUBLIC_ENCRYPTION_KEY: 'mock-primary-key'
          EXPO_PUBLIC_LEGACY_ENCRYPTION_KEY: POSCursor_Sec_2024_Ph
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-tests:
    name: 3. Playwright End-to-End Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_ALLOW_PRODUCTION_DB: '1'
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  build-android-apk:
    name: 4. Build Android APK
    needs: [typecheck-and-lint, unit-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch-V2' || github.event_name == 'workflow_dispatch'
    outputs:
      apk-url: ${{ steps.release.outputs.apk-url }}
      app-version: ${{ steps.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENCRYPTION_KEY: ${{ secrets.EXPO_PUBLIC_ENCRYPTION_KEY }}
          EXPO_PUBLIC_APP_URL: 'https://jetfarm.pages.dev'

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew app:assembleRelease \
            -x lint \
            -x test \
            --configure-on-demand \
            --build-cache \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pexpo.useLegacyPackaging=true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENCRYPTION_KEY: ${{ secrets.EXPO_PUBLIC_ENCRYPTION_KEY }}

      - name: Locate and rename APK
        id: locate-apk
        run: |
          VERSION=${{ steps.version.outputs.app-version }}
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK: $APK_SRC"
          mkdir -p dist-apk
          cp "$APK_SRC" "dist-apk/JetFarm-v${VERSION}.apk"
          cp "$APK_SRC" "dist-apk/jetfarm.apk"
          echo "apk-versioned=dist-apk/JetFarm-v${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "apk-latest=dist-apk/jetfarm.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetfarm-apk-${{ steps.version.outputs.app-version }}
          path: dist-apk/
          retention-days: 30

      - name: Publish to GitHub Releases
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.app-version }}
          TAG="v${VERSION}"
          VERSIONED_APK="dist-apk/JetFarm-v${VERSION}.apk"
          LATEST_APK="dist-apk/jetfarm.apk"

          # Create or update release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading with --clobber"
            gh release upload "$TAG" "$VERSIONED_APK" "$LATEST_APK" --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" "$VERSIONED_APK" "$LATEST_APK" \
              --title "JetFarm $TAG" \
              --notes "## JetFarm ${TAG}

### Downloads
- [JetFarm-v${VERSION}.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/JetFarm-v${VERSION}.apk)
- [jetfarm.apk (latest)](https://github.com/${{ github.repository }}/releases/latest/download/jetfarm.apk)
- Web Portal: https://jetfarm.pages.dev/download

### Info
- **Version**: \`${VERSION}\`
- **Built**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
- **Commit**: ${{ github.sha }}
"
          fi

          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/JetFarm-v${VERSION}.apk"
          echo "apk-url=$APK_URL" >> $GITHUB_OUTPUT
          echo "Versioned APK published: $APK_URL"

  build-and-deploy:
    name: 5. Build Web & Deploy to Cloudflare Pages
    needs: [typecheck-and-lint, unit-tests, build-android-apk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch-V2' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Build Web Production Export
        run: npm run export:web:production
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENCRYPTION_KEY: ${{ secrets.EXPO_PUBLIC_ENCRYPTION_KEY }}
          EXPO_PUBLIC_APP_URL: 'https://jetfarm.pages.dev'

      - name: Prepare Cloudflare dist (_redirects, _headers, download page, version.json)
        run: node scripts/prepare-cloudflare-dist.mjs
        env:
          APK_REDIRECT_URL: ${{ needs.build-android-apk.outputs.apk-url }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_APP_URL: 'https://jetfarm.pages.dev'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'jetfarm'
          directory: 'dist'
          branch: 'main'
