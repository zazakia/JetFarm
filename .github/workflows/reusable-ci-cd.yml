name: Reusable Modular CI/CD Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
        description: 'Node.js version to use'
      run-typecheck:
        type: boolean
        default: true
        description: 'Run TypeScript compiler check'
      run-unit-tests:
        type: boolean
        default: true
        description: 'Run Jest unit tests'
      run-e2e-tests:
        type: boolean
        default: false
        description: 'Run Playwright E2E tests'
      deploy-target:
        type: string
        default: 'cloudflare'
        description: 'Deployment target: cloudflare, github-pages, or none'
      cloudflare-project-name:
        type: string
        default: 'jetfarm'
        description: 'Cloudflare Pages project name'
      build-command:
        type: string
        default: 'npm run export:web:production'
        description: 'Command to build production web export'
      output-dir:
        type: string
        default: 'dist'
        description: 'Directory of build output'
      apk-redirect-url:
        type: string
        default: ''
        description: 'Direct APK download URL to wire into /download redirect'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      EXPO_PUBLIC_SUPABASE_URL:
        required: false
      EXPO_PUBLIC_SUPABASE_ANON_KEY:
        required: false
      EXPO_PUBLIC_ENCRYPTION_KEY:
        required: false

jobs:
  typecheck-and-lint:
    if: ${{ inputs.run-typecheck }}
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Compiler Check
        run: npx tsc --noEmit
      - name: CRUD + Persistence Contract Check
        run: node scripts/audit-crud-persistence.mjs --fail-on-high

  unit-tests:
    if: ${{ inputs.run-unit-tests }}
    name: Jest Unit & Integration Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Jest Tests
        run: npm test -- --coverage --ci --maxWorkers=2 --forceExit
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
          EXPO_PUBLIC_ENCRYPTION_KEY: 'mock-primary-key'
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-tests:
    if: ${{ inputs.run-e2e-tests }}
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_ALLOW_PRODUCTION_DB: '1'
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-cloudflare:
    if: ${{ inputs.deploy-target == 'cloudflare' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch-V2' || github.event_name == 'workflow_dispatch') }}
    name: Deploy to Cloudflare Pages
    needs: [typecheck-and-lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Web Application
        run: ${{ inputs.build-command }}
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ENCRYPTION_KEY: ${{ secrets.EXPO_PUBLIC_ENCRYPTION_KEY }}
          EXPO_PUBLIC_APP_URL: 'https://jetfarm.pages.dev'
      - name: Prepare Cloudflare dist (_redirects, _headers, download page, version.json)
        run: node scripts/prepare-cloudflare-dist.mjs
        env:
          APK_REDIRECT_URL: ${{ inputs.apk-redirect-url }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_APP_URL: 'https://jetfarm.pages.dev'
      - name: Deploy via Cloudflare Pages Action
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ inputs.cloudflare-project-name }}
          directory: ${{ inputs.output-dir }}
          branch: 'main'
