# Metabase BI Stack — Viterbo Foods OPC / Crispy King
# Deploy on Hetzner CPX11 (Singapore) at ₱305/mo
# Usage: docker compose up -d

version: '3.9'

services:
  metabase:
    image: metabase/metabase:v0.50.6
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: "${METABASE_DB_PASSWORD}"
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: Asia/Manila
      MB_SITE_NAME: "Crispy King BI"
      MB_ADMIN_EMAIL: "${METABASE_ADMIN_EMAIL}"
    depends_on:
      metabase-db:
        condition: service_healthy
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  metabase-db:
    image: postgres:15-alpine
    container_name: metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase_app
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: "${METABASE_DB_PASSWORD}"
    volumes:
      - metabase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - metabase

volumes:
  metabase-data:
  metabase-pgdata:
  caddy-data:
  caddy-config:
