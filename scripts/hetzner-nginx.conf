server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Direct APK installer endpoints for JetFarm
    location = /download {
        return 302 /download/jetfarm-latest.apk;
    }

    location = /download/ {
        return 302 /download/jetfarm-latest.apk;
    }

    location = /download/latest {
        return 302 /download/jetfarm-latest.apk;
    }

    location ~* ^/download/v[0-9.]+$ {
        rewrite ^/download/v(.*)$ /download/jetfarm-v$1.apk redirect;
    }

    # Serve APK files with proper MIME type and download headers
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
